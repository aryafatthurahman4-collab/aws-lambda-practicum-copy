services:
  # LocalEmu - AWS Cloud Emulator
  localemu:
    image: localemu/localemu:latest
    ports:
      - "${LOCAL_EMULATOR_PORT:-14566}:4566"      # Main gateway
      - "14610-14659:4510-4559"  # External service ports
    environment:
      - DASHBOARD_API_OPEN=1
      - PERSISTENCE=1
      - IAM_ENFORCEMENT=0
    volumes:
      - localemu-data:/var/lib/localemu
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    networks:
      - aws-local

  # RDS MySQL (Simulation)
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lambda_db
      MYSQL_USER: lambda_user
      MYSQL_PASSWORD: lambda_password
    ports:
      - "${LOCAL_MYSQL_PORT:-13307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - aws-local

  # Simple web server untuk testing
  lambda-web:
    build: .
    ports:
      - "${LOCAL_WEB_PORT:-19000}:9000"
    depends_on:
      - localemu
    networks:
      - aws-local

volumes:
  localemu-data:
  mysql-data:

networks:
  aws-local:
    driver: bridge
